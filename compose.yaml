x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  database:
    <<: *runtime
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corridor
      POSTGRES_USER: corridor
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U corridor"]
      interval: 5s
      timeout: 3s
      retries: 20

  research:
    <<: *runtime
    stop_grace_period: 30s
    build: ./research-service
    environment:
      DATABASE_URL: "postgresql+psycopg://corridor@database:5432/corridor"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      SIMULATION_MODE: sumo
      AGENT_MODE: process
    volumes:
      - agent-state:/app/state
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    <<: *runtime
    build: ./backend
    environment:
      RESEARCH_URL: http://research:8000
    depends_on:
      research:
        condition: service_healthy

  frontend:
    <<: *runtime
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  agent-state:
